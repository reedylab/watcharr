  <circle cx="74" cy="40" r="7" fill="none" stroke="#F43F5E" stroke-width="1" opacity="0.3"/>

  <!-- Wordmark inline: WATCH white, ARR rose -->
  <text x="96" y="52" font-family="'Arial Black', 'Helvetica Neue', sans-serif" font-size="42" font-weight="900" fill="#F8FAFC" letter-spacing="-1.5">WATCH<tspan fill="#F43F5E">ARR</tspan></text>
</svg>
