<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 80" width="560" height="80">

  <!-- Icon -->
  <rect x="0" y="0" width="80" height="80" rx="16" fill="#1E293B"/>
  <!-- Pulse/heartbeat line -->
  <path d="M 6 40 L 18 40 L 24 20 L 30 56 L 36 28 L 42 40 L 56 40 L 62 32 L 68 40 L 74 40"
        fill="none" stroke="#F43F5E" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Active dot -->
